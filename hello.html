<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity 破冰成功！</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      padding: 20px;
    }

    .card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.88), rgba(255, 240, 245, 0.8));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 28px;
      padding: 48px 36px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 
                  0 1px 3px rgba(0, 0, 0, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.12);
    }

    .badge {
      display: inline-block;
      font-size: 0.85rem;
      letter-spacing: 1px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.75);
      color: #6366f1;
      border-radius: 9999px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.15);
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #2d3748;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #4f46e5, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.3;
    }

    p.subtitle {
      color: #718096;
      font-size: 0.95rem;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .glow-btn {
      position: relative;
      outline: none;
      border: none;
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      padding: 16px 36px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #f43f5e 100%);
      background-size: 200% 200%;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.5), 
                  0 8px 24px rgba(168, 85, 247, 0.35);
      transition: all 0.3s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .glow-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(236, 72, 153, 0.8), 
                  0 10px 30px rgba(168, 85, 247, 0.6);
      background-position: right center;
    }

    .glow-btn:active {
      transform: scale(0.97);
    }

    .result-section {
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px dashed rgba(160, 174, 192, 0.3);
      min-height: 90px;
    }

    .counter {
      font-size: 0.95rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 10px;
    }

    .counter span {
      display: inline-block;
      font-size: 1.25rem;
      font-weight: 800;
      color: #ec4899;
      min-width: 24px;
    }

    .quote {
      font-size: 1.05rem;
      color: #334155;
      font-weight: 500;
      line-height: 1.5;
      opacity: 1;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .quote.fade {
      opacity: 0;
      transform: translateY(6px);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">🚀 Mission Complete</div>
    <h1>Antigravity 破冰成功！</h1>
    <p class="subtitle">歡迎來到探索之旅，按下按鈕開始收集能量與好心情！</p>

    <button id="actionBtn" class="glow-btn">點我領取能量 ✨</button>

    <div class="result-section">
      <div class="counter">
        累計點擊次數：<span id="clickCount">0</span> 次
      </div>
      <p id="quote" class="quote">點擊上方按鈕，接收今天的第一句鼓勵吧！</p>
    </div>
  </div>

  <script>
    const quotes = [
      "每一步前進，都是改變的開始！✨",
      "程式碼如同詩篇，你正在創造奇蹟！💻",
      "今天也是充滿無限可能的一天！🌱",
      "保持好奇心與熱情，世界會為你讓路！🚀",
      "相信過程，微小的累積終將成就非凡！🌟",
      "破冰成功，接下來的旅程一定更加精彩！🎉",
      "乾杯！願你的靈感不斷湧現、無往不利！🍻",
      "專注當下，你比想像中的自己更優秀！💪",
      "勇敢嘗試新事物，收穫總在意料之外！🌈",
      "把每一行代碼，都寫成探索未來的魔法！🪄"
    ];

    let count = 0;
    const btn = document.getElementById('actionBtn');
    const countDisplay = document.getElementById('clickCount');
    const quoteDisplay = document.getElementById('quote');

    btn.addEventListener('click', () => {
      count++;
      countDisplay.textContent = count;

      // 短暫淡出切換文字
      quoteDisplay.classList.add('fade');
      setTimeout(() => {
        const randomIndex = Math.floor(Math.random() * quotes.length);
        quoteDisplay.textContent = quotes[randomIndex];
        quoteDisplay.classList.remove('fade');
      }, 200);
    });
  </script>
</body>
</html>
